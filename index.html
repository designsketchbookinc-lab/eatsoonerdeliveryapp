<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eat Sooner: Working Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pacifico&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2F3E9E;--card:#25317F;--line:#5563C4;--deep:#1B2466;--gold:#F2B600;--orange:#D1350F;--ink:#FFF4D6;--muted:#C9D0F5;--dark:#1A1A1A;--green:#355E3B}
body.courier{--bg:#1F2A6E;--card:#18205A;--line:#4452A8;--deep:#111845}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45}
main{max-width:430px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
.logo{width:320px;height:108px;align-self:center;position:relative;flex-shrink:0}
.logo-inner{width:640px;height:216px;transform:scale(.5);transform-origin:0 0;position:relative;display:flex;align-items:center;justify-content:center}
h1,h2{font-family:'Space Grotesk',sans-serif;font-weight:700;margin:0;line-height:1.15}
h1{font-size:26px}
h2{font-size:20px}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--deep);padding:6px;border-radius:16px}
.tabs button{height:44px;border-radius:12px;border:none;background:none;color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--gold);color:var(--dark)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
label,.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--deep);color:var(--ink);padding:0 14px;font:16px Inter,sans-serif;width:100%}
input::placeholder{color:#9AA5E0}
.seg{display:grid;gap:8px}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--deep);color:var(--ink);font:14px Inter,sans-serif;cursor:pointer;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.seg button small{font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--dark);font-weight:600}
.seg button[aria-pressed="true"] small{color:#3A3000}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fee{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px}
.cta{height:56px;border-radius:16px;border:none;background:var(--orange);color:var(--ink);font:700 17px 'Space Grotesk',sans-serif;cursor:pointer;width:100%}
.ghost{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer}
.err{color:var(--gold);font-size:14px;font-weight:500;min-height:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:'Space Grotesk',sans-serif;font-size:22px}
.tile span{font-size:12px;color:var(--muted)}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:10px;white-space:nowrap}
.b-requested{background:var(--gold);color:var(--dark)}
.b-accepted,.b-picked{background:var(--green);color:var(--ink)}
.b-delivered{background:var(--deep);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo{border:1px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="logo"><div class="logo-inner">
<svg aria-hidden="true" width="640" height="216" viewBox="0 0 640 216" style="position: absolute; left: 0; top: 0">
<path d="M70 96 C52 44 150 20 226 32 C300 12 384 22 452 28 C540 16 612 52 596 104 C618 150 540 176 452 166 C372 182 292 174 222 172 C136 184 44 160 70 96 Z" fill="#F2B600"></path>
<rect x="150" y="150" width="14" height="50" rx="7" fill="#F2B600"></rect>
<rect x="300" y="160" width="10" height="34" rx="5" fill="#F2B600"></rect>
<rect x="420" y="150" width="16" height="58" rx="8" fill="#F2B600"></rect>
<rect x="520" y="148" width="10" height="38" rx="5" fill="#F2B600"></rect>
<g fill="#D1350F"><circle cx="40" cy="40" r="5"></circle><circle cx="96" cy="24" r="3"></circle><circle cx="180" cy="12" r="4"></circle><circle cx="330" cy="6" r="3"></circle><circle cx="470" cy="8" r="5"></circle><circle cx="560" cy="18" r="3"></circle><circle cx="622" cy="70" r="4"></circle><circle cx="628" cy="130" r="3"></circle><circle cx="30" cy="130" r="4"></circle><circle cx="110" cy="192" r="3"></circle><circle cx="250" cy="198" r="4"></circle><circle cx="370" cy="204" r="3"></circle><circle cx="480" cy="206" r="2.5"></circle><circle cx="580" cy="188" r="4"></circle><circle cx="16" cy="84" r="2.5"></circle></g>
<g fill="#355E3B"><circle cx="120" cy="52" r="5"></circle><circle cx="240" cy="40" r="3.5"></circle><circle cx="400" cy="36" r="4"></circle><circle cx="540" cy="60" r="5"></circle><circle cx="566" cy="130" r="4"></circle><circle cx="180" cy="152" r="4"></circle><circle cx="340" cy="162" r="3.5"></circle><circle cx="90" cy="120" r="3.5"></circle></g>
<g fill="#F2B600"><circle cx="22" cy="60" r="6"></circle><circle cx="612" cy="178" r="7"></circle><circle cx="596" cy="26" r="4"></circle><circle cx="64" cy="198" r="4"></circle><circle cx="200" cy="206" r="3"></circle><circle cx="440" cy="4" r="3"></circle><circle cx="636" cy="100" r="2.5"></circle><circle cx="8" cy="160" r="3"></circle></g>
<g fill="#8FA0FF"><circle cx="140" cy="8" r="3"></circle><circle cx="540" cy="200" r="3.5"></circle><circle cx="604" cy="152" r="2.5"></circle><circle cx="50" cy="172" r="3"></circle><circle cx="310" cy="208" r="2.5"></circle></g>
<g fill="#1F2A6E"><circle cx="150" cy="70" r="2.5"></circle><circle cx="500" cy="46" r="2.5"></circle><circle cx="476" cy="152" r="3"></circle><circle cx="210" cy="160" r="2"></circle></g>
</svg>
<div style="position: relative; display: flex; align-items: baseline; justify-content: center; gap: 26px; font-family: Pacifico, cursive; font-size: 88px; line-height: 1.5; color: #1F2A6E; text-shadow: 4px 4px 0 #D1350F">
<span>eat</span>
<div style="display: flex; align-items: baseline; gap: 3px">
<span>s</span>
<svg role="img" aria-label="Two wheels standing in for the letters o o" width="104" height="50" viewBox="0 0 112 54"><circle cx="27" cy="27" r="21" fill="none" stroke="#D1350F" stroke-width="10"></circle><circle cx="85" cy="27" r="21" fill="none" stroke="#D1350F" stroke-width="10"></circle><circle cx="27" cy="27" r="5" fill="#1F2A6E"></circle><circle cx="85" cy="27" r="5" fill="#1F2A6E"></circle></svg>
<span>ner</span>
</div>
</div></div>
<div class="tabs" role="tablist" aria-label="Choose a side of the app">
<button role="tab" id="tab-restaurant" data-action="view" data-v="restaurant">Restaurant</button>
<button role="tab" id="tab-courier" data-action="view" data-v="courier">Courier</button>
</div>
<div id="app" style="display:flex;flex-direction:column;gap:18px"></div>
<div class="demo">
<span>This is a demo. Both sides run on this one device, so use the tabs to switch between the restaurant and the courier. No real courier is contacted and no one is charged.</span>
<button class="ghost" data-action="reset" style="align-self:flex-start">Reset demo</button>
</div>
</main>
<script>
const TIERS={short:{label:'Short',range:'Up to 0.5 mi',fee:5.25},standard:{label:'Standard',range:'0.5 to 1.5 mi',fee:5.75},long:{label:'Long',range:'1.5 to 2.5 mi',fee:6.75}};
const STATUS={requested:'Finding a courier',accepted:'Courier heading to you',picked:'On the way to customer',delivered:'Delivered'};
const SIZES=['One bag','Two bags','Cake box'];
const READY=['Now','10 min','20 min'];
const MODES=['Bike','E-bike','Walk','Transit'];
const SHOP='Neighborhood Bakery';
const fresh=()=>({view:'restaurant',deliveries:[],declined:[],online:true,mode:'Bike',nextId:1,form:{addr:'',phone:'',tier:'short',size:'One bag',ready:'Now'}});
let state=fresh();
let error='';
try{const s=localStorage.getItem('eatsooner-demo');if(s){state=Object.assign(fresh(),JSON.parse(s));}}catch(e){}
function save(){try{localStorage.setItem('eatsooner-demo',JSON.stringify(state));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return '$'+n.toFixed(2);}
function seg(name,options,current,cols){
  return '<div class="seg c'+cols+'">'+options.map(o=>'<button type="button" data-action="'+name+'" data-v="'+esc(o.v)+'" aria-pressed="'+(o.v===current)+'">'+esc(o.t)+(o.s?'<small>'+esc(o.s)+'</small>':'')+'</button>').join('')+'</div>';
}
function restaurantView(){
  const f=state.form,t=TIERS[f.tier],d=state.deliveries;
  const out=d.filter(x=>x.status!=='delivered').length,done=d.filter(x=>x.status==='delivered').length;
  const fees=d.reduce((a,x)=>a+x.fee,0);
  let h='<div><p class="muted">'+SHOP+' (demo restaurant)</p><h1>Request a courier</h1></div>';
  h+='<section class="card">';
  h+='<label>Customer address<input id="addr" data-field="addr" autocomplete="off" placeholder="Street address and apartment" value="'+esc(f.addr)+'"></label>';
  h+='<label>Customer phone (optional)<input id="phone" type="tel" data-field="phone" autocomplete="off" placeholder="For delivery updates by text" value="'+esc(f.phone)+'"></label>';
  h+='<div class="lab">Trip distance'+seg('tier',Object.keys(TIERS).map(k=>({v:k,t:TIERS[k].label,s:TIERS[k].range})),f.tier,3)+'</div>';
  h+='<div class="lab">Order size'+seg('size',SIZES.map(s=>({v:s,t:s})),f.size,3)+'</div>';
  h+='<div class="lab">Ready for pickup in'+seg('ready',READY.map(s=>({v:s,t:s})),f.ready,3)+'</div>';
  h+='<div class="row"><span class="muted">Delivery fee, '+t.label.toLowerCase()+' trip</span><span class="fee">'+money(t.fee)+'</span></div>';
  h+='<p class="err" role="alert">'+esc(error)+'</p>';
  h+='<button class="cta" data-action="request">Request a courier</button>';
  h+='</section>';
  h+='<h2>Today\'s deliveries</h2>';
  h+='<div class="tiles"><div class="tile"><span>Out now</span><b>'+out+'</b></div><div class="tile"><span>Delivered</span><b>'+done+'</b></div><div class="tile"><span>Fees so far</span><b>'+money(fees)+'</b></div></div>';
  if(!d.length){h+='<p class="muted">No deliveries yet. Request a courier above, then switch to the Courier tab to accept it.</p>';}
  else{h+='<div class="list">'+d.slice().reverse().map(x=>'<div class="card" style="gap:6px"><div class="row"><b>'+esc(x.addr)+'</b><span class="badge b-'+x.status+'">'+STATUS[x.status]+'</span></div><span class="muted">'+esc(x.size)+' · '+TIERS[x.tier].label+' trip · '+money(x.fee)+(x.courier?' · '+esc(x.courier):'')+'</span></div>').join('')+'</div>';}
  return h;
}
function jobCard(x,buttons){
  return '<div class="card"><div class="row"><span class="badge b-'+x.status+'">'+(x.status==='requested'?'New delivery offer':STATUS[x.status])+'</span><span class="muted">'+TIERS[x.tier].range+'</span></div>'+
  '<div><span class="muted">Pick up, ready '+esc(x.ready==='Now'?'now':'in '+x.ready)+'</span><p><b>'+SHOP+'</b></p></div>'+
  '<div><span class="muted">Drop off</span><p><b>'+esc(x.addr)+'</b></p></div>'+
  '<span class="muted">'+esc(x.size)+' · Pay to be set, plus 100% of tips</span>'+buttons+'</div>';
}
function courierView(){
  const d=state.deliveries;
  const mine=d.filter(x=>x.status==='accepted'||x.status==='picked');
  const offers=d.filter(x=>x.status==='requested'&&!state.declined.includes(x.id));
  const done=d.filter(x=>x.status==='delivered').length;
  let h='<section class="card"><div class="row"><div><p class="muted">Verified account</p><h1>'+(state.online?'You\'re online':'You\'re offline')+'</h1></div><button class="ghost" data-action="online">'+(state.online?'Go offline':'Go online')+'</button></div>';
  h+='<div class="lab">Delivering by'+seg('mode',MODES.map(s=>({v:s,t:s})),state.mode,4)+'</div></section>';
  if(mine.length){
    h+='<h2>Your active delivery</h2><div class="list">'+mine.map(x=>jobCard(x,x.status==='accepted'?'<button class="cta" data-action="picked" data-id="'+x.id+'">I picked it up</button>':'<button class="cta" data-action="delivered" data-id="'+x.id+'">Mark as delivered</button>')).join('')+'</div>';
  }
  h+='<h2>Delivery offers</h2>';
  if(!state.online){h+='<p class="muted">Go online to see delivery offers.</p>';}
  else if(!offers.length){h+='<p class="muted">No offers right now. Switch to the Restaurant tab and request a courier to see one appear here.</p>';}
  else{h+='<div class="list">'+offers.map(x=>jobCard(x,'<div class="two"><button class="ghost" style="min-height:56px" data-action="decline" data-id="'+x.id+'">Decline</button><button class="cta" data-action="accept" data-id="'+x.id+'">Accept</button></div><span class="muted">Declining never counts against your account.</span>')).join('')+'</div>';}
  h+='<div class="tiles"><div class="tile"><span>Delivered today</span><b>'+done+'</b></div><div class="tile"><span>Mode</span><b style="font-size:16px;line-height:1.7">'+esc(state.mode)+'</b></div><div class="tile"><span>Tips</span><b style="font-size:16px;line-height:1.7">100% yours</b></div></div>';
  return h;
}
function render(){
  document.body.classList.toggle('courier',state.view==='courier');
  document.getElementById('tab-restaurant').setAttribute('aria-selected',state.view==='restaurant');
  document.getElementById('tab-courier').setAttribute('aria-selected',state.view==='courier');
  document.getElementById('app').innerHTML=state.view==='courier'?courierView():restaurantView();
  save();
}
function find(id){return state.deliveries.find(x=>x.id===Number(id));}
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.field;if(f){state.form[f]=e.target.value;save();}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action,v=b.dataset.v,x=b.dataset.id?find(b.dataset.id):null;
  error='';
  if(a==='view'){state.view=v;try{location.hash=v;}catch(err){}}
  else if(a==='tier'||a==='size'||a==='ready'){state.form[a]=v;}
  else if(a==='mode'){state.mode=v;}
  else if(a==='online'){state.online=!state.online;}
  else if(a==='request'){
    const addr=state.form.addr.trim();
    if(!addr){error='Add the customer address first.';}
    else{
      state.deliveries.push({id:state.nextId++,addr:addr,phone:state.form.phone.trim(),tier:state.form.tier,size:state.form.size,ready:state.form.ready,fee:TIERS[state.form.tier].fee,status:'requested',courier:''});
      state.form.addr='';state.form.phone='';
    }
  }
  else if(a==='accept'&&x){x.status='accepted';x.courier='Courier by '+state.mode.toLowerCase();}
  else if(a==='decline'&&x){state.declined.push(x.id);}
  else if(a==='picked'&&x){x.status='picked';}
  else if(a==='delivered'&&x){x.status='delivered';}
  else if(a==='reset'){const view=state.view;state=fresh();state.view=view;}
  render();
});
function fromHash(){const h=(location.hash||'').replace('#','');if(h==='restaurant'||h==='courier'){state.view=h;render();}}
window.addEventListener('hashchange',fromHash);
render();fromHash();
</script>
</body>
</html>
